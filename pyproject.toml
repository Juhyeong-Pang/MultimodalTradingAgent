    "dotenv>=0.9.9",
    "tensorflow>=2.21.0",
    "pandas-ta>=0.4.71b0",
    "scikit-learn>=1.8.0",
    "pygooglenews>=0.1.3",
    "keras-hub>=0.19.0",
    "keras>=3.13.2",
    "datetime>=6.0",
    "asyncio>=4.0.0",
    "dataclasses>=0.8",
    "nltk>=3.9.4",
